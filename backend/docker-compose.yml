version: '3.8'

services:
  # 1. PostgreSQL Primary
  postgres:
    image: postgres:16-alpine
    container_name: animeat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: animeat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
- ../supabase/migrations/000_base_schema.sql:/docker-entrypoint-initdb.d/000_base_schema.sql:ro
      - ../supabase/migrations/007_secure_rls_policies.sql:/docker-entrypoint-initdb.d/007_secure_rls_policies.sql:ro
      - ../supabase/migrations/008_api_v1_canonical_schema.sql:/docker-entrypoint-initdb.d/008_api_v1_canonical_schema.sql:ro
      - ../supabase/migrations/009_notifications.sql:/docker-entrypoint-initdb.d/009_notifications.sql:ro
      - ../supabase/migrations/010_sellers_vendors_reconciliation.sql:/docker-entrypoint-initdb.d/010_sellers_vendors_reconciliation.sql:ro
      - ../supabase/migrations/010_menus_items_deals_schema.sql:/docker-entrypoint-initdb.d/010_menus_items_deals_schema.sql:ro
      - ../supabase/migrations/012_users_pages_schema.sql:/docker-entrypoint-initdb.d/012_users_pages_schema.sql:ro
      - ../supabase/migrations/013_seed_catalog_data.sql:/docker-entrypoint-initdb.d/013_seed_catalog_data.sql:ro
      - ../supabase/migrations/014_fix_id_types_and_rls.sql:/docker-entrypoint-initdb.d/014_fix_id_types_and_rls.sql:ro
      - ../supabase/migrations/015_security_hardening.sql:/docker-entrypoint-initdb.d/015_security_hardening.sql:ro
      - ../supabase/migrations/016_server_side_money_validation.sql:/docker-entrypoint-initdb.d/016_server_side_money_validation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animeat"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. PgBouncer (Connection Pooler) - sits between API and Postgres
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: animeat_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:6432"
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/animeat
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 5
      MAX_DB_CONNECTIONS: 50
      USER: postgres
      PASSWORD: postgrespassword
      AUTH_TYPE: md5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animeat -p 6432 -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis 7 (In-Memory Cache & Ephemeral State)
  redis:
    image: redis:7-alpine
    container_name: animeat_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. NATS JetStream (Durable Event Bus)
  nats:
    image: nats:2.10-alpine
    container_name: animeat_nats
    restart: unless-stopped
    ports:
      - "4222:4222" # NATS client port
      - "8222:8222" # Management / Monitoring port
    command: ["-js", "-m", "8222"]
    volumes:
      - natsdata:/data

  # 5. Go API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: animeat_api
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgrespassword@pgbouncer:6432/animeat?sslmode=disable
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      SUPABASE_JWT_SECRET: super-secret-jwt-key-for-local-dev-must-change
      RAZORPAY_KEY_ID: rzp_test_key
      RAZORPAY_KEY_SECRET: rzp_test_secret
      PAYMENT_WEBHOOK_SECRET: webhook_secret_key

  # 6. k6 Load Tester (optional; runs only with `--profile loadtest`)
  k6:
    image: grafana/k6:latest
    container_name: animeat_k6
    profiles: ["loadtest"]
    depends_on:
      - api
    volumes:
      - ../loadtest:/loadtest:ro
    working_dir: /loadtest
    command: run -e TIER=1k -e DURATION=5m scenarios.js
    network_mode: "host"

volumes:
  pgdata:
  redisdata:
  natsdata:
